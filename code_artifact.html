<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уютный Хаб — Генератор идей и подборок</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] },
                    colors: {
                        hub: {
                            bg: '#0B1914',
                            card: '#11241D',
                            elevated: '#173027',
                            border: '#214236',
                            text: '#F5EFE6',
                            muted: '#A4B8AF',
                            accent: '#EAD5B7',
                            lightBg: '#F6F2EA',
                            lightCard: '#FFFFFF',
                            lightElevated: '#ECE4D5',
                            lightBorder: '#DCD2BE',
                            lightText: '#14261F',
                            lightMuted: '#556B61',
                            lightAccent: '#184A3B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-font-smoothing: antialiased; transition: background-color 0.2s ease, color 0.2s ease; }
        .hub-border { border-color: #DCD2BE; }
        .dark .hub-border { border-color: #214236; }
        .active-tile { box-shadow: 0 0 0 1.5px #184A3B, 0 8px 20px -6px rgba(24, 74, 59, 0.22); }
        .dark .active-tile { box-shadow: 0 0 0 1.5px #EAD5B7, 0 10px 24px -6px rgba(0, 0, 0, 0.55); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .anim-card { animation: fadeUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes bulbGlow {
            0%, 100% { opacity: 0.45; transform: scale(0.92); }
            50% { opacity: 1; transform: scale(1.08); }
        }
        .garland-bulb { animation: bulbGlow 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    </style>
</head>
<body class="bg-hub-lightBg text-hub-lightText dark:bg-hub-bg dark:text-hub-text min-h-screen flex flex-col font-sans selection:bg-hub-accent selection:text-hub-bg">

    <!-- ШАПКА -->
    <header class="w-full max-w-[960px] mx-auto px-4 pt-5 pb-4 flex flex-wrap items-center justify-between gap-3">
        <!-- Логотип -->
        <button type="button" onclick="selectAllCategories()" class="flex items-center gap-2.5 text-left group focus:outline-none shrink-0">
            <span class="w-10 h-10 rounded-xl bg-hub-lightAccent dark:bg-hub-elevated border hub-border flex items-center justify-center text-hub-lightBg dark:text-hub-accent group-hover:scale-105 transition-transform">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18m0-18l-4 5h8l-4-5zm0 5l-6 7h12l-6-7zm0 7l-7 6h14l-7-6z"/>
                </svg>
            </span>
            <div>
                <span class="font-bold text-base sm:text-lg tracking-tight block leading-none">Уютный Хаб</span>
                <span class="text-[11px] text-hub-lightMuted dark:text-hub-muted block mt-1">Случайные идеи без мук выбора</span>
            </div>
        </button>

        <!-- Правая группа элементов -->
        <div class="flex flex-wrap items-center gap-2 sm:gap-2.5">
            <!-- Живой автоматический отсчёт до Нового года -->
            <div class="h-9 px-3 rounded-xl bg-hub-lightCard dark:bg-hub-card border hub-border flex items-center gap-1.5 text-xs font-medium text-hub-lightMuted dark:text-hub-muted tabular-nums" title="Автоматический отсчёт до 1 января">
                <span class="text-sm leading-none">🎄</span>
                <span id="ny-text">Загрузка...</span>
            </div>

            <!-- Предложить идею -->
            <button type="button" onclick="openSuggestModal()" class="h-9 px-3.5 rounded-xl bg-hub-lightCard dark:bg-hub-card hover:bg-hub-lightElevated dark:hover:bg-hub-elevated border hub-border text-xs font-medium flex items-center gap-1.5 transition-colors">
                <span class="font-bold text-hub-lightAccent dark:text-hub-accent">+</span>
                <span>Предложить идею</span>
            </button>

            <!-- Переключатель темы -->
            <button type="button" onclick="toggleTheme()" aria-label="Переключить тему" class="h-9 px-3 rounded-xl bg-hub-lightCard dark:bg-hub-card hover:bg-hub-lightElevated dark:hover:bg-hub-elevated border hub-border text-xs font-medium flex items-center gap-1.5 transition-colors">
                <svg id="icon-sun" class="w-4 h-4 hidden dark:block text-hub-accent" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
                <svg id="icon-moon" class="w-4 h-4 block dark:hidden text-hub-lightAccent" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
                <span id="theme-label">Светлая</span>
            </button>
        </div>
    </header>

    <!-- TOAST УВЕДОМЛЕНИЯ -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-16 opacity-0 transition-all duration-200 pointer-events-none">
        <div class="px-4 py-2.5 rounded-xl bg-hub-lightCard dark:bg-hub-elevated border hub-border text-xs sm:text-sm font-medium shadow-xl flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-hub-lightAccent dark:bg-hub-accent"></span>
            <span id="toast-text">Готово</span>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="w-full max-w-[960px] mx-auto px-4 pb-8 flex-1 flex flex-col justify-center space-y-6">

        <!-- ГЛАВНАЯ КАРТОЧКА РЕЗУЛЬТАТА -->
        <section aria-label="Результат генератора" class="relative overflow-hidden rounded-[24px] bg-hub-lightCard dark:bg-hub-card border hub-border px-5 pb-6 pt-7 sm:px-8 sm:pb-8 sm:pt-8 shadow-sm">
            
            <!-- АККУРАТНАЯ ТЁПЛАЯ ГИРЛЯНДА ПО САМОМУ ВЕРХНЕМУ КРАЮ -->
            <div aria-hidden="true" class="pointer-events-none select-none absolute top-0 left-0 right-0 h-[22px]">
                <svg viewBox="0 0 960 22" preserveAspectRatio="none" class="w-full h-full block">
                    <path d="M0,1 Q120,15 240,3 T480,3 T720,3 T960,1" fill="none" class="stroke-hub-lightBorder dark:stroke-hub-border" stroke-width="1.2"/>
                    <circle cx="60" cy="9" r="2.4" fill="#EAD5B7" class="garland-bulb" style="animation-delay: 0.0s"/>
                    <circle cx="120" cy="12" r="2.6" fill="#F2C97D" class="garland-bulb" style="animation-delay: 0.5s"/>
                    <circle cx="180" cy="9" r="2.3" fill="#4E9F82" class="garland-bulb" style="animation-delay: 1.0s"/>
                    <circle cx="300" cy="9" r="2.4" fill="#F2C97D" class="garland-bulb" style="animation-delay: 1.5s"/>
                    <circle cx="360" cy="12" r="2.6" fill="#EAD5B7" class="garland-bulb" style="animation-delay: 2.0s"/>
                    <circle cx="420" cy="9" r="2.3" fill="#4E9F82" class="garland-bulb" style="animation-delay: 2.5s"/>
                    <circle cx="540" cy="9" r="2.4" fill="#EAD5B7" class="garland-bulb" style="animation-delay: 0.3s"/>
                    <circle cx="600" cy="12" r="2.6" fill="#F2C97D" class="garland-bulb" style="animation-delay: 0.8s"/>
                    <circle cx="660" cy="9" r="2.3" fill="#4E9F82" class="garland-bulb" style="animation-delay: 1.3s"/>
                    <circle cx="780" cy="9" r="2.4" fill="#F2C97D" class="garland-bulb" style="animation-delay: 1.8s"/>
                    <circle cx="840" cy="12" r="2.6" fill="#EAD5B7" class="garland-bulb" style="animation-delay: 2.3s"/>
                    <circle cx="900" cy="9" r="2.3" fill="#4E9F82" class="garland-bulb" style="animation-delay: 2.8s"/>
                </svg>
            </div>

            <!-- ВЕРХНЯЯ СТРОКА: БЕЙДЖИ И СЧЁТЧИК -->
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                <div class="flex flex-wrap items-center gap-2">
                    <span id="res-cat-badge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-hub-lightElevated dark:bg-hub-elevated text-hub-lightAccent dark:text-hub-accent border hub-border"></span>
                    <span id="res-genre-badge" class="hidden inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-hub-lightElevated/70 dark:bg-hub-elevated/80 border hub-border"></span>
                    <button type="button" id="reset-cat-btn" onclick="selectAllCategories()" class="hidden text-xs text-hub-lightAccent dark:text-hub-accent hover:underline underline-offset-4 ml-1">(все разделы)</button>
                </div>
                <span id="res-counter" class="text-xs font-medium text-hub-lightMuted dark:text-hub-muted tabular-nums"></span>
            </div>

            <!-- СТРОКА ВЫБОРА ЖАНРОВ (Аниме, Фильмы, Сериалы, Книги) -->
            <div id="genre-bar" class="hidden mb-5 pb-4 border-b hub-border">
                <div id="genre-pills" class="flex flex-wrap gap-1.5"></div>
            </div>

            <!-- МЕТА-СТРОКА (Год • Серии/Длительность/Автор • Жанр) -->
            <div id="res-meta" class="text-xs sm:text-sm font-medium text-hub-lightMuted dark:text-hub-muted mb-2"></div>

            <!-- ЗАГОЛОВОК И ОПИСАНИЕ -->
            <div id="res-body" class="min-h-[115px] sm:min-h-[135px] flex flex-col justify-center"></div>

            <!-- НИЖНЯЯ ПАНЕЛЬ ДЕЙСТВИЙ -->
            <div class="mt-6 pt-5 border-t hub-border flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5">
                    <button type="button" onclick="rollNext()" class="px-6 py-3 rounded-xl bg-hub-lightAccent hover:opacity-95 dark:bg-hub-accent dark:hover:opacity-90 text-hub-lightBg dark:text-hub-bg font-semibold text-sm flex items-center justify-center gap-2 transition-all active:scale-[0.99] shadow-sm">
                        <svg id="roll-icon" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
                        </svg>
                        <span>Следующий вариант</span>
                    </button>
                    <button type="button" onclick="openEveningModal()" class="px-5 py-3 rounded-xl bg-hub-lightElevated hover:opacity-90 dark:bg-hub-elevated dark:hover:opacity-90 border hub-border font-medium text-sm flex items-center justify-center gap-2 transition-all active:scale-[0.99]">
                        <span>✨</span>
                        <span>Собрать вечер</span>
                    </button>
                </div>
                <span class="hidden md:inline-flex items-center gap-1.5 text-xs text-hub-lightMuted dark:text-hub-muted">
                    <span>Или нажми</span>
                    <kbd class="px-2 py-0.5 rounded-md bg-hub-lightElevated dark:bg-hub-elevated border hub-border text-[11px] font-mono">Пробел</kbd>
                </span>
            </div>
        </section>

        <!-- СЕТКА КАТЕГОРИЙ (8 ПЛИТОК: 4x2 ПК / 2x4 МОБ) -->
        <section aria-label="Выбор категории">
            <div class="flex items-center justify-between mb-3 px-1">
                <h2 class="text-xs sm:text-sm font-medium text-hub-lightMuted dark:text-hub-muted">Выбери категорию (повторный клик крутит дальше)</h2>
                <span id="total-badge" class="text-xs font-medium text-hub-lightMuted dark:text-hub-muted tabular-nums">8 категорий · 460 идей</span>
            </div>
            <div id="cat-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
        </section>
    </main>

    <!-- МОДАЛКА: СОБРАТЬ ВЕЧЕР -->
    <div id="evening-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-sm" onclick="if(event.target===this)closeEveningModal()">
        <div class="bg-hub-lightCard dark:bg-hub-card border hub-border w-full max-w-lg rounded-3xl p-5 sm:p-6 shadow-2xl anim-card max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h3 class="text-lg font-bold tracking-tight">✨ Собрать вечер</h3>
                    <p class="text-xs text-hub-lightMuted dark:text-hub-muted">Сценарий из 3 слотов — перекрути любой отдельно</p>
                </div>
                <button type="button" onclick="closeEveningModal()" class="w-8 h-8 rounded-xl bg-hub-lightElevated dark:bg-hub-elevated flex items-center justify-center text-sm">✕</button>
            </div>
            <div id="evening-slots" class="space-y-3"></div>
            <div class="mt-5 pt-4 border-t hub-border flex items-center gap-3">
                <button type="button" onclick="generateEvening()" class="flex-1 py-2.5 px-4 rounded-xl bg-hub-lightAccent dark:bg-hub-accent text-hub-lightBg dark:text-hub-bg font-semibold text-xs sm:text-sm hover:opacity-95">Перекрутить всё</button>
                <button type="button" onclick="closeEveningModal()" class="py-2.5 px-4 rounded-xl bg-hub-lightElevated dark:bg-hub-elevated text-xs sm:text-sm font-medium">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА: ПРЕДЛОЖИТЬ ИДЕЮ -->
    <div id="suggest-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-sm" onclick="if(event.target===this)closeSuggestModal()">
        <div class="bg-hub-lightCard dark:bg-hub-card border hub-border w-full max-w-md rounded-3xl p-5 sm:p-6 shadow-2xl anim-card">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h3 class="text-lg font-bold tracking-tight">Предложить идею</h3>
                    <p class="text-xs text-hub-lightMuted dark:text-hub-muted">Сохранится в браузере и сразу попадёт в рандом</p>
                </div>
                <button type="button" onclick="closeSuggestModal()" class="w-8 h-8 rounded-xl bg-hub-lightElevated dark:bg-hub-elevated flex items-center justify-center text-sm">✕</button>
            </div>
            <form onsubmit="submitIdea(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-hub-lightMuted dark:text-hub-muted mb-1">Категория</label>
                    <select id="m-cat" onchange="syncModalFields()" class="w-full px-3.5 py-2.5 rounded-xl bg-hub-lightElevated dark:bg-hub-elevated border hub-border text-sm font-medium focus:outline-none">
                        <option value="anime">🎌 Аниме</option>
                        <option value="movies">🎬 Фильмы</option>
                        <option value="series">📺 Сериалы</option>
                        <option value="books">📚 Книги</option>
                        <option value="draw">✏️ Порисовать</option>
                        <option value="home">🏠 Дома</option>
                        <option value="street">🌲 Улица</option>
                        <option value="food">🍵 Рецепты</option>
                    </select>
                </div>
                <div id="m-genre-box">
                    <label class="block text-xs font-medium text-hub-lightMuted dark:text-hub-muted mb-1">Жанр</label>
                    <select id="m-genre" class="w-full px-3.5 py-2.5 rounded-xl bg-hub-lightElevated dark:bg-hub-elevated border hub-border text-sm font-medium focus:outline-none"></select>
                </div>
                <div class="grid grid-cols-3 gap-2.5" id="m-year-row">
                    <div class="col-span-1">
                        <label class="block text-xs font-medium text-hub-lightMuted dark:text-hub-muted mb-1">Год</label>
                        <input type="text" id="m-year" placeholder="2023" class="w-full px-3 py-2.5 rounded-xl bg-hub-lightElevated dark:bg-hub-elevated border hub-border text-sm focus:outline-none">
                    </div>
                    <div class="col-span-2">
                        <label id="m-meta-lbl" class="block text-xs font-medium text-hub-lightMuted dark:text-hub-muted mb-1">Серии / Автор / Время</label>
                        <input type="text" id="m-meta" placeholder="12 серий • Школа" class="w-full px-3 py-2.5 rounded-xl bg-hub-lightElevated dark:bg-hub-elevated border hub-border text-sm focus:outline-none">
                    </div>
                </div>
                <div>
                    <label id="m-title-lbl" class="block text-xs font-medium text-hub-lightMuted dark:text-hub-muted mb-1">Название</label>
                    <input type="text" id="m-title" required placeholder="Например: Бессонница после школы" class="w-full px-3.5 py-2.5 rounded-xl bg-hub-lightElevated dark:bg-hub-elevated border hub-border text-sm focus:outline-none">
                </div>
                <div id="m-desc-box">
                    <label class="block text-xs font-medium text-hub-lightMuted dark:text-hub-muted mb-1">Описание (2–3 предложения)</label>
                    <textarea id="m-desc" required rows="3" placeholder="О чём история, атмосфера и чем цепляет..." class="w-full px-3.5 py-2.5 rounded-xl bg-hub-lightElevated dark:bg-hub-elevated border hub-border text-sm focus:outline-none resize-none"></textarea>
                </div>
                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeSuggestModal()" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium text-hub-lightMuted dark:text-hub-muted">Отмена</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-hub-lightAccent dark:bg-hub-accent text-hub-lightBg dark:text-hub-bg font-semibold text-xs sm:text-sm">Добавить в базу</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const CATEGORIES = [
            { id: 'anime',  name: 'Аниме',      icon: '🎌', hasGenres: true },
            { id: 'movies', name: 'Фильмы',     icon: '🎬', hasGenres: true },
            { id: 'series', name: 'Сериалы',    icon: '📺', hasGenres: true },
            { id: 'books',  name: 'Книги',      icon: '📚', hasGenres: true },
            { id: 'draw',   name: 'Порисовать', icon: '✏️', hasGenres: false },
            { id: 'home',   name: 'Дома',       icon: '🏠', hasGenres: false },
            { id: 'street', name: 'Улица',      icon: '🌲', hasGenres: false },
            { id: 'food',   name: 'Рецепты',    icon: '🍵', hasGenres: false }
        ];

        const GENRES = {
            anime:  ['Романтика', 'Фэнтези', 'Повседневность', 'Триллер', 'Фантастика', 'Драма', 'Комедия', 'Детектив', 'Психология'],
            movies: ['Романтика', 'Фэнтези', 'Триллер', 'Фантастика', 'Драма', 'Комедия', 'Детектив', 'Психология'],
            series: ['Романтика', 'Фэнтези', 'Триллер', 'Фантастика', 'Драма', 'Комедия', 'Детектив', 'Психология'],
            books:  ['Романтика', 'Фэнтези', 'Триллер', 'Фантастика', 'Драма', 'Комедия', 'Детектив', 'Психология']
        };

        // Формат строки: [cat, genre, title, year, meta, desc]
        const RAW_DB = [
            // ==================== ANIME (105) ====================
            ['anime','Романтика','Бессонница после школы','2023','13 серий • Школа, Астрономия','Страдающие от бессонницы старшеклассники Ганта и Исаки находят убежище в заброшенной школьной обсерватории. Они возрождают астрономический клуб, гуляют по ночному городу и фотографируют звёзды под очень живую и тёплую акварельную рисовку.'],
            ['anime','Романтика','Любовь с кончиков пальцев','2024','12 серий • Университет, Жесты','Глухая от рождения студентка Юки живёт в тихом мире переписок, пока в поезде ей не помогает полиглот и путешественник Ицуоми. Вместо жалости парень проявляет искренний интерес к её миру и языку жестов.'],

            ['home','','Сложить сложное оригами из квадратного листа бумаги','','20 минут • Антистресс для рук','Обрежь обычный лист бумаги в ровный квадрат и найди схему классического журавлика, лебедя или оригами-дракона. Монотонная работа пальцами отлично разгружает голову.'],
            ['home','','Построить уютный форт из пледов и посмотреть мультфильм','','Вечер • Максимальный уют','Натяни большой плед между спинками стульев и диваном, накидай внутрь подушек, повесь тёплую гирлянду и принеси ноутбук с любимым мультфильмом детства.'],
            ['home','','Собрать идеальный плейлист под конкретное настроение','','30 минут • Музыка','Открой стриминг и собери подборку из 15–20 треков строго под одну атмосферу: например, «ночная поездка под дождём» или «воскресное утро с кофе».'],
            ['home','','Устроить полноценный домашний спа-вечер','','45 минут • Перезагрузка','Прими горячий душ или ванну с солью, сделай маску для лица, надень самую мягкую одежду и завари травяной чай с мятой и мёдом под спокойный лоу-фай фон.'],
            ['home','','Разобрать фотоплёнку в телефоне и создать альбом «Лучшее»','','30 минут • Цифровой порядок','Открой галерею за последний год, удали дубликаты и случайные скриншоты, а самые тёплые кадры перенеси в отдельный альбом «Избранное», чтобы потом распечатать.'],
            ['home','','Погулять по Google Картам в случайной точке планеты','','25 минут • Виртуальное путешествие','Открой Google Street View, закрой глаза и ткни наугад в карту Исландии, японской глубинки или старой Италии. Поброди по незнакомым дорогам, рассматривая дома и природу.'],
            ['home','','Потренироваться жонглировать тремя мандаринами или носками','','20 минут • Новый навык','Сверни три пары носков в плотные шарики (они не укатываются, когда падают). Начни с перебрасывания двух предметов по высокой дуге, а через 20 минут сделаешь первые каскады тремя.'],
            ['home','','Сделать перестановку и расхламление на рабочем столе','','30 минут • Свежий взгляд','Убери со стола всё лишнее, протри пыль, спрячь провода, переставь лампу или растение на другую сторону. Небольшое изменение пространства моментально освежает голову.'],
            ['home','','Включить прямой эфир с камер МКС из космоса на весь экран','','Фон на вечер • Бесплатно','Найди на YouTube официальную прямую трансляцию с борта МКС, выведи её на большой экран, выключи свет и включи фоновый космический эмбиент.'],
            ['home','','Выучить корейский алфавит хангыль за один вечер','','25 минут • Разминка для мозга','Попробуй за полчаса разобраться в логике корейского алфавита хангыль — он создавался специально так, чтобы любой человек мог научиться читать за один вечер.'],
            ['home','','Собрать мудборд на ближайший сезон или год','','40 минут • Вдохновение','Создай закрытую доску в Pinterest или коллаж, собрав 15–20 картинок мест, книг, образов и занятий, которые отражают то, каким ты хочешь видеть свой ближайший год.'],
            ['home','','Сделать 15-минутную мягкую растяжку для спины и шеи','','15 минут • Здоровье','Постели коврик или плед на пол, включи спокойное видео с вечерней растяжкой без сложных поз. Плавные наклоны моментально снимут зажимы после сидения за столом.'],
            ['home','','Устроить домашнее караоке по любимым трекам детства','','30 минут • Настроение','Найди на YouTube минусовки с текстом любимых песен из 2000-х, мультфильмов или аниме-опенингов и спой от души, не стесняясь попадать в ноты.'],
            ['home','','Нарисовать карту выдуманного мира с помощью горсти риса','','35 минут • Творчество','Высыпь на плотный лист бумаги горсть сухого риса, распредели кучками и обведи контуры карандашом — получатся реалистичные материки и острова, которым останется придумать названия.'],
            ['home','','Посмотреть часовой стендап-концерт любимого комика','','60 минут • Смех','Выключи уведомления, завари чай и посмотри целый сольный концерт комика, чей юмор тебе близок — полноценное выступление работает намного лучше коротких нарезок.'],
            ['home','','Потренировать слепую печать на клавиатуре','','20 минут • Полезный навык','Зайди на бесплатный тренажёр Ratatype или Keybr и пройди пару уроков, стараясь вообще не смотреть на клавиши. Уже через пару вечеров скорость набора заметно вырастет.'],
            ['home','','Пройтись по виртуальным залам Лувра или Эрмитажа','','30 минут • Искусство','Открой официальный онлайн-тур по музею на компьютере и рассмотри в сверхвысоком разрешении мелкие детали знаменитых полотен, которые вживую не разглядеть из-за толпы.'],
            ['home','','Поиграть с друзьями онлайн в браузерный «Крокодил» (Gartic.io)','','40 минут • Для компании','Создай бесплатную комнату в Gartic.io или Skribbl.io, скинь ссылку друзьям в чат и устройте турнир по угадыванию кривых рисунков мышкой на время.'],
            ['home','','Провести 1 час полного цифрового детокса при свечах','','60 минут • Тишина','Отложи смартфон и ноутбук в другую комнату, зажги свечи или ночник и проведи час в тишине с бумажной книгой, скетчбуком или просто глядя в окно.'],
            ['home','','Попробовать нейросеть для генерации музыки (Suno / Udio)','','30 минут • Эксперимент','Зайди в генератор музыки и создай песню в стиле джаза или панк-рока про своего кота, друзей или вчерашний день.'],
            ['home','','Устроить вечер настольных головоломок или пазлов','','45 минут • Медитация','Достань коробку с пазлом на 500–1000 деталей, кубик Рубика или открой онлайн-судоку повышенной сложности под спокойную музыку.'],
            ['home','','Послушать целый музыкальный альбом от первого до последнего трека','','45 минут • Музыка','Вместо случайного перемешивания выбери культовый альбом (Pink Floyd, Daft Punk или саундтрек к любимому фильму) и послушай его целиком с закрытыми глазами.'],
            ['home','','Сделать список из 50 вещей, которые приносят тебе радость','','20 минут • Самопознание','Запиши в заметки всё подряд — от запаха свежего хлеба и хруста снега до любимой серии сериала. В грустный день этот список сработает как готовая аптечка.'],
            ['home','','Освоить базовые фокусы с монетой или колодой карт','','25 минут • Ловкость рук','Открой пару обучающих видео по классическому исчезновению монеты или ложной тасовке карт и потренируйся перед зеркалом, чтобы удивлять друзей в компании.'],
            ['home','','Посмотреть документальный фильм о природе от BBC (Планета Земля)','','50 минут • Визуальный релакс','Включи серию про глубоководный океан или снежные вершины в высоком качестве с закадровым голосом Дэвида Аттенборо — работает лучше любой медитации.'],
            ['home','','Навести порядок в подписках и закладках браузера','','20 минут • Лёгкость','Отпишись от десятка мёртвых каналов и рассылок, которые только создают шум, и оставь только то, что действительно интересно читать и смотреть.'],

            // ==================== STREET (25) ====================
            ['street','','Фотоохота на «одноцветные» кадры на улицах города','','1.5 часа • Бесплатно','Выйди на прогулку с телефоном, задав тему: сегодня фотографируешь только объекты одного цвета (например, ярко-жёлтого или изумрудного) — двери, вывески, листья, машины.'],
            ['street','','Поход в букинистический магазин или лавку комиксов','','1 час • Небольшой бюджет','Зайди в независимый книжный или магазин комиксов и манги с правилом: не смотреть рейтинги в интернете, а выбрать одну книгу наугад — только по обложке и первому абзацу.'],
            ['street','','Прогулка по незнакомому району с термосом горячего чая','','2 часа • Почти бесплатно','Завари дома вкусный чай в термос, сядь на трамвай или автобус до конечной остановки в районе, где никогда не гулял, и просто поброди по тихим улочкам без навигатора.'],
            ['street','','Встретить закат на набережной, мосту или смотровой точке','','1 час • Бесплатно','Посмотри в погоде точное время заката, приди за 20 минут на открытую точку у воды или на возвышенности с любимым плейлистом в наушниках и просто проводи солнце.'],
            ['street','','Зайти в новую спешелти-кофейню и взять необычный напиток','','1 час • Бюджет на кофе','Откажись от привычного американо или капучино: закажи авторский лавандовый раф, пряный чай-латте, матча-тоник или бамбл-кофе и посиди полчаса у окна.'],
            ['street','','Сходить в кино на самый первый утренний или поздний ночной сеанс','','2.5 часа • Средний бюджет','В почти пустом зале кинотеатра утром в будний день или на последнем ночном сеансе создаётся особая камерная атмосфера — будто кино крутят лично для тебя.'],
            ['street','','Покататься на велосипеде или самокате по лесопарку','','1.5 часа • Активный отдых','Прокатись по велодорожкам большого парка или набережной без спешки и спортивных рекордов, останавливаясь в красивых местах, чтобы подышать свежим воздухом.'],
            ['street','','Зайти в магазин азиатских или редких заморских сладостей','','45 минут • Небольшой бюджет','Собери небольшой пакет из 4–5 странных позиций, которые никогда не пробовал: моти, напитки с шариками, необычные чипсы или острую лапшу для вечерней дегустации.'],
            ['street','','Покормить белок или уток у пруда в парке','','1 час • Почти бесплатно','Захвати из дома нежареные семечки, грецкие орехи или фундук (без соли и сахара!) и погуляй по тихим аллеям парка, наблюдая за лесными жителями.'],
            ['street','','Сходить в планетарий на полнокупольный фильм о космосе','','1.5 часа • Средний бюджет','Откинуться в мягком кресле под гигантским куполом, над которым вращаются миллионы звёзд, туманности и далёкие галактики — лучший способ почувствовать масштаб Вселенной.'],
            ['street','','Устроить мини-пикник в парке на пледе','','2 часа • Небольшой бюджет','Возьми непромокаемый плед, пару домашних сэндвичей, сезонные фрукты, термос с чаем и книгу. Даже обычный обед на траве под деревьями ощущается как маленький отпуск.'],
            ['street','','Посетить котокафе или тайм-кафе с настолками','','2 часа • Средний бюджет','Проведи пару часов в компании десятка мурчащих котиков, которые свободно гуляют по залу, выпей чай с печеньем и почитай книгу в мягком кресле-мешке.'],
            ['street','','Прогуляться по вечернему городу сразу после тёплого дождя','','1 час • Бесплатно','Когда дождь только закончился, улицы пустеют, воздух становится свежим, а неоновые вывески и фонари красиво отражаются в мокром асфальте как в кадре из кино.'],
            ['street','','Зайти в винтажный магазин или секонд-хенд на охоту за находками','','1.5 часа • Любой бюджет','Покопаться на вешалках в поисках уютного винтажного свитера, необычной джинсовки, старинной броши или забавной кружки — настоящий азарт кладоискателя.'],
            ['street','','Сходить в ботанический сад или тропическую оранжерею','','1.5 часа • Небольшой бюджет','Заходишь с улицы и через минуту оказываешься в тёплых влажных тропиках среди пальм, орхидей и кактусов — особенно круто работает в пасмурную погоду.'],
            ['street','','Посетить мастер-класс по гончарному делу или лепке из глины','','2 часа • Средний бюджет','Слепить своими руками кривоватую, но самую уютную кружку или пиалу на гончарном круге — невероятно тактильное занятие, которое потом останется с тобой на годы.'],
            ['street','','Сходить на скалодром для новичков (боулдеринг)','','2 часа • Средний бюджет','Боулдеринг не требует страховки и подготовки: ты просто лезешь по невысоким трассам над мягкими матами, решая головоломки собственным телом.'],
            ['street','','Сесть на утреннюю электричку и уехать в соседний городок на полдня','','Пол дня • Небольшой бюджет','Выбери небольшой исторический городок или посёлок у озера в часе езды. Смена пейзажа за окном и прогулка по незнакомым улочкам дадут ощущение мини-путешествия.'],
            ['street','','Прокатиться на речном трамвайчике или пароме','','1.5 часа • Средний бюджет','Посмотреть на привычный город с воды — с палубы даже знакомые набережные и мосты открываются с совершенно нового ракурса.'],
            ['street','','Сходить на вечерний открытый микрофон стендапа','','2 часа • Бесплатно или напиток','В местных барах и клубах проходят открытые микрофоны, где комики проверяют новый материал — вход обычно свободный или за заказ напитка, а атмосфера очень живая.'],
            ['street','','Посидеть со скетчбуком на скамейке в парке или кофейне','','1 час • Бесплатно','Возьми блокнот и карандаш и попробуй зарисовать архитектуру здания напротив, деревья или быстрые силуэты прохожих без стирательной резинки.'],
            ['street','','Пройти пешком весь привычный маршрут вместо транспорта','','1.5 часа • Бесплатно','Выйди на несколько остановок раньше или пройди весь путь пешком, сворачивая во дворы и скверы — удивишься, сколько новых деталей заметишь вокруг.'],
            ['street','','Сходить в краеведческий или технический музей своего города','','1.5 часа • Небольшой бюджет','Зайти в музей ретро-техники, минералогии или истории родного города — отличная смена обстановки на пару часов, особенно в прохладный день.'],
            ['street','','Поиграть в настольный теннис на уличном столе в парке','','1 час • Бесплатно','Во многих городских парках стоят бесплатные столы для пинг-понга — достаточно кинуть в рюкзак пару недорогих ракеток и мячик.'],
            ['street','','Устроить вечернюю прогулку по празднично украшенному центру','','1.5 часа • Бесплатно','Пройтись по центральным улицам, витринам и площадям в сумерках, когда зажигаются гирлянды и вечерняя подсветка зданий, согреваясь тёплым напитком.'],

            // ==================== FOOD (25) ====================
            ['food','','Домашний сырный рамен за 15 минут','','15 минут • Простые продукты • К фильму','Вскипяти 400 мл бульона с ложкой соевого соуса, чесноком и имбирём. Свари в нём лапшу, в конце добавь ломтик плавленого сыра для сливочности, а сверху выложи яйцо всмятку и зелёный лук.'],
            ['food','','Пряный густой какао с маршмеллоу и корицей','','10 минут • Напиток • Уютный вечер','Подогрей 250 мл молока, добавь 2 ч. ложки какао, 3 дольки тёмного шоколада, щепотку корицы и ванили, помешивая венчиком. Перелей в кружку и брось сверху мини-маршмеллоу.'],
            ['food','','Хрустящие чесночно-сырные тосты на сковороде','','10 минут • Быстрый перекус','Смажь два ломтика тостового хлеба сливочным маслом снаружи, внутрь положи щедрый слой тёртого сыра с сушёным чесноком и обжарь под крышкой по 2 минуты с каждой стороны.'],
            ['food','','Пышные банановые панкейки из 3 ингредиентов','','15 минут • Завтрак или десерт • Без сахара','Разомни 1 спелый банан в пюре, вбей 2 яйца и всыпь 3–4 ст. ложки овсяных хлопьев или муки с разрыхлителем. Жарь оладьи на сухой сковороде по 2 минуты и подай с мёдом или ягодами.'],
            ['food','','Японский сэндвич Тамаго-сандо с нежным яичным салатом','','15 минут • Японская классика','Отвари 3 яйца, разомни желтки с 2 ложками майонеза, щепоткой соли, сахара и каплей горчицы, вмешай мелко нарезанные белки и намажь между двумя ломтями мягкого белого хлеба.'],
            ['food','','Шоколадный брауни-кекс в кружке за 3 минуты','','3 минуты • Микроволновка','Смешай в большой кружке 3 ст. л. муки, 2 ст. л. какао, 2 ст. л. сахара, разрыхлитель, 1 яйцо, 3 ст. л. молока и 1 ст. л. масла. Поставь в микроволновку на 80–90 секунд.'],
            ['food','','Хрустящие картофельные дольки по-деревенски в духовке','','30 минут • Духовка','Нарежь картофель дольками, обсуши полотенцем, перемешай с маслом, паприкой, сушёным чесноком и солью и запекай в один слой при 200 °C около 25 минут до румяной корочки.'],
            ['food','','Освежающий бамбл-кофе с апельсиновым соком','','5 минут • Холодный напиток','Наполни высокий стакан льдом доверху, влей 150 мл охлаждённого апельсинового сока и 1 ложку карамельного сиропа, а сверху аккуратно по ложке влей порцию свежего эспрессо.'],
            ['food','','Сливочная паста с чесноком и пармезаном за 12 минут','','12 минут • Одна сковорода','Отвари спагетти аль денте, сохранив полстакана воды от варки. На сковороде растопи сливочное масло с чесноком, переложи пасту, влей воду от варки, 100 мл сливок и тёртый сыр.'],
            ['food','','Горячий безалкогольный яблочный глинтвейн','','12 минут • Согревающий напиток','Налей в кастрюлю 500 мл натурального яблочного сока, добавь 3 дольки апельсина, палочку корицы, 2 гвоздики, кусочек имбиря и ложку мёда. Прогрей 7–10 минут, не доводя до кипения.'],
            ['food','','Домашние рисовые треугольники Онигири с тунцом','','20 минут • Перекус','Свари круглозерный рис до клейкости. Смешай консервированный тунец с ложкой майонеза, влажными руками слепи плотный треугольник с начинкой внутри и оберни полоской нори.'],
            ['food','','Карамелизированные бананы на сковороде с пломбиром','','10 минут • Десерт','Разрежь 2 банана вдоль пополам, обжарь срезом вниз в 20 г сливочного масла с ложкой сахара и корицей по 2 минуты до карамели и подавай горячими с шариком пломбира.'],
            ['food','','Шакшука — яйца в пряном томатном соусе','','15 минут • Сытный завтрак или ужин','Обжарь сладкий перец, лук и чеснок с зирой и паприкой, добавь резаные томаты, потуши 5 минут, сделай углубления, вбей туда 3 яйца и готовь под крышкой 4 минуты до жидкого желтка.'],
            ['food','','Домашний сырно-чесночный попкорн в кастрюле','','8 минут • К кино • Бюджетно','Налей в кастрюлю с толстым дном 2 ложки масла, всыпь зёрна попкорна в один слой под крышкой на среднем огне. Когда хлопки стихнут, перемешай с мелким тёртым сыром и сушёным чесноком.'],
            ['food','','Хрустящая кесадилья с курицей, кукурузой и сыром','','15 минут • Мексиканский перекус','На половину пшеничной тортильи выложи тёртый сыр, кусочки готовой курицы, кукурузу и каплю томатного соуса, накрой второй половиной и обжарь на сухой сковороде по 2 минуты.'],
            ['food','','Густой молочный коктейль с печеньем «Орео»','','5 минут • Блендер','Взбей в блендере 200 мл холодного молока, 2 больших шарика ванильного пломбира и 4 шоколадных печенья с кремом за 30 секунд до густой пены.'],
            ['food','','Запечённый камамбер с чесноком, розмарином и багетом','','15 минут • Для компании','Сделай надрезы крест-накрест на головке сыра камамбер, воткни пластинки чеснока и розмарин, сбрызни маслом и запеки 12 минут при 180 °C, чтобы макать хрустящий багет.'],
            ['food','','Домашние начос с тёплым сырным соусом Чеддер','','10 минут • Закуска','Растопи на медленном огне 100 мл сливок со 150 г тёртого сыра чеддер и щепоткой паприки до гладкого соуса и подавай с кукурузными чипсами начос и сальсой.'],
            ['food','','Спагетти Карбонара по классическому рецепту без сливок','','15 минут • Итальянская классика','Обжарь бекон до хруста, в миске взбей 2 желтка с 50 г тёртого пармезана и чёрным перцем. Смешай горячие спагетти с беконом, сними с огня и вмешай соус с парой ложек воды от пасты.'],
            ['food','','Хрустящие куриные стрипсы в кукурузных хлопьях','','25 минут • Духовка или сковорода','Нарежь куриное филе полосками, посоли, обмакни во взбитое яйцо, затем обваляй в измельчённых несладких кукурузных хлопьях и запеки 15 минут до золотистого хруста.'],
            ['food','','Пряный масала-чай на молоке с кардамоном и имбирём','','10 минут • Согревающий напиток','Вскипяти 150 мл воды с чёрным чаем, ломтиком свежего имбиря, раздавленным кардамоном и корицей, влей 150 мл молока, добавь мёд и процеди в кружку.'],
            ['food','','Авокадо-тост на хрустящем хлебе с яйцом пашот','','12 минут • Полезный завтрак','Подсуши ломтик зернового хлеба на сковороде, разомни вилкой спелое авокадо с лимонным соком и солью, выложи сверху и укрась яйцом пашот и кунжутом.'],
            ['food','','Домашний лимонад с мятой, лаймом и ягодами','','7 минут • Освежающий напиток','Разомни в кувшине горсть свежей мяты, дольки лайма и замороженные ягоды с ложкой мёда, залей газированной водой со льдом и дай настояться 5 минут.'],
            ['food','','Запечённые яблоки с творогом, корицей и грецким орехом','','20 минут • Уютный десерт','Вырежи сердцевину у двух крупных яблок, наполни смесью мягкого творога, мёда, корицы и дробленых орехов и запеки 15–18 минут при 180 °C до мягкости.'],
            ['food','','Брускетты с вялеными томатами, творожным сыром и базиликом','','10 минут • Быстрая закуска','Подрумянь ломтики багета на сухой сковороде, намажь сливочным творожным сыром и выложи сверху кусочки вяленых томатов и свежий базилик.']
        ];

        const ITEMS = RAW_DB.map((r, i) => ({
            id: `db-${i}`,
            category: r[0],
            genre: r[1] || '',
            title: r[2],
            year: r[3] || '',
            meta: r[4] || '',
            desc: r[5] || ''
        }));

        let DATA = [];
        let activeCat = 'all';
        let activeGenre = 'all';
        let seen = {};
        let currentItem = null;
        let spinDeg = 0;
        let eveningSlots = { watch: null, food: null, act: null };

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            startNewYearCountdown();
            loadData();
            renderTiles();
            rollNext(true);

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    const m1 = document.getElementById('suggest-modal').classList.contains('hidden');
                    const m2 = document.getElementById('evening-modal').classList.contains('hidden');
                    const tag = document.activeElement?.tagName;
                    if (m1 && m2 && tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
                        e.preventDefault();
                        rollNext();
                    }
                }
            });
        });

        function loadData() {
            try {
                const custom = JSON.parse(localStorage.getItem('cozy_hub_v4') || '[]');
                DATA = [...custom, ...ITEMS];
            } catch {
                DATA = [...ITEMS];
            }
            document.getElementById('total-badge').textContent = `8 категорий · ${DATA.length} идей`;
        }

        function getCat(id) {
            return CATEGORIES.find(c => c.id === id) || { id: 'all', name: 'Все разделы', icon: '🌲', hasGenres: false };
        }

        function updateThemeLabel() {
            const isDark = document.documentElement.classList.contains('dark');
            const lbl = document.getElementById('theme-label');
            if (lbl) lbl.textContent = isDark ? 'Светлая' : 'Тёмная';
        }

        function initTheme() {
            if (localStorage.getItem('cozy_hub_theme') === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
            updateThemeLabel();
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('cozy_hub_theme', isDark ? 'dark' : 'light');
            updateThemeLabel();
        }

        function pluralDays(n) {
            const mod10 = n % 10;
            const mod100 = n % 100;
            if (mod10 === 1 && mod100 !== 11) return 'день';
            if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return 'дня';
            return 'дней';
        }

        function startNewYearCountdown() {
            const el = document.getElementById('ny-text');
            if (!el) return;

            const update = () => {
                const now = new Date();
                const currentYear = now.getFullYear();

                if (now.getMonth() === 0 && now.getDate() === 1) {
                    el.innerHTML = `<span class="font-semibold text-hub-lightAccent dark:text-hub-accent">С Новым ${currentYear} годом!</span>`;
                    return;
                }

                const nextYear = currentYear + 1;
                const target = new Date(nextYear, 0, 1, 0, 0, 0);
                const diff = Math.max(0, target - now);

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const mins = Math.floor((diff / (1000 * 60)) % 60);

                el.innerHTML = `До ${nextYear}: <strong class="font-semibold text-hub-lightText dark:text-hub-accent">${days} ${pluralDays(days)}</strong> <span class="hidden sm:inline">${String(hours).padStart(2, '0')} ч. ${String(mins).padStart(2, '0')} м.</span>`;
            };

            update();
            setInterval(update, 15000);
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            document.getElementById('toast-text').textContent = msg;
            el.classList.remove('translate-y-16', 'opacity-0');
            setTimeout(() => el.classList.add('translate-y-16', 'opacity-0'), 2400);
        }

        function renderTiles() {
            const grid = document.getElementById('cat-grid');
            grid.innerHTML = CATEGORIES.map(cat => {
                const count = DATA.filter(x => x.category === cat.id).length;
                const isActive = activeCat === cat.id;
                return `
                    <button type="button" onclick="pickCategory('${cat.id}')"
                        class="flex items-center justify-between gap-2 px-3.5 py-3.5 rounded-2xl border hub-border text-left transition-all active:scale-[0.98] ${
                            isActive
                            ? 'bg-hub-lightElevated dark:bg-hub-elevated active-tile font-semibold'
                            : 'bg-hub-lightCard dark:bg-hub-card hover:bg-hub-lightElevated/60 dark:hover:bg-hub-elevated/70'
                        }">
                        <span class="flex items-center gap-2 min-w-0">
                            <span class="text-lg shrink-0">${cat.icon}</span>
                            <span class="text-xs sm:text-sm truncate">${cat.name}</span>
                        </span>
                        <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full shrink-0 tabular-nums ${
                            isActive
                            ? 'bg-hub-lightAccent text-hub-lightBg dark:bg-hub-accent dark:text-hub-bg'
                            : 'bg-hub-lightElevated dark:bg-hub-elevated text-hub-lightMuted dark:text-hub-muted'
                        }">${count}</span>
                    </button>
                `;
            }).join('');
        }

        function renderGenres() {
            const bar = document.getElementById('genre-bar');
            const pills = document.getElementById('genre-pills');
            const cat = getCat(activeCat);

            if (!cat.hasGenres) {
                bar.classList.add('hidden');
                return;
            }

            bar.classList.remove('hidden');
            const list = ['all', ...(GENRES[activeCat] || [])];
            pills.innerHTML = list.map(g => {
                const label = g === 'all' ? 'Все жанры' : g;
                const count = g === 'all'
                    ? DATA.filter(x => x.category === activeCat).length
                    : DATA.filter(x => x.category === activeCat && x.genre === g).length;
                if (count === 0 && g !== 'all') return '';
                const isAct = activeGenre === g;
                return `
                    <button type="button" onclick="pickGenre('${g}')"
                        class="px-3 py-1 rounded-full text-xs font-medium border hub-border transition-colors ${
                            isAct
                            ? 'bg-hub-lightAccent text-hub-lightBg dark:bg-hub-accent dark:text-hub-bg font-semibold'
                            : 'bg-hub-lightElevated/60 dark:bg-hub-elevated/60 hover:bg-hub-lightElevated dark:hover:bg-hub-elevated'
                        }">
                        ${label} <span class="opacity-70 ml-0.5">(${count})</span>
                    </button>
                `;
            }).join('');
        }

        function selectAllCategories() {
            activeCat = 'all';
            activeGenre = 'all';
            renderTiles();
            renderGenres();
            rollNext();
        }

        function pickCategory(id) {
            if (activeCat !== id) {
                activeCat = id;
                activeGenre = 'all';
                renderTiles();
                renderGenres();
            }
            rollNext();
        }

        function pickGenre(g) {
            activeGenre = g;
            renderGenres();
            rollNext();
        }

        function getPool() {
            return DATA.filter(item => {
                if (activeCat !== 'all' && item.category !== activeCat) return false;
                if (activeGenre !== 'all' && item.genre !== activeGenre) return false;
                return true;
            });
        }

        function rollNext(isFirst = false) {
            const pool = getPool();
            if (!pool.length) return;

            const key = `${activeCat}:${activeGenre}`;
            if (!seen[key]) seen[key] = new Set();

            let avail = pool.filter(x => !seen[key].has(x.id));
            if (avail.length === 0) {
                seen[key].clear();
                avail = pool.filter(x => !currentItem || x.id !== currentItem.id);
                if (!avail.length) avail = pool;
                if (!isFirst) showToast('Круг пройден — начинаем заново!');
            }

            const picked = avail[Math.floor(Math.random() * avail.length)];
            seen[key].add(picked.id);
            currentItem = picked;

            if (!isFirst) {
                spinDeg += 180;
                const icon = document.getElementById('roll-icon');
                if (icon) icon.style.transform = `rotate(${spinDeg}deg)`;
            }

            renderResult(picked, seen[key].size, pool.length);
        }

        function renderResult(item, idx, total) {
            const cat = getCat(item.category);
            document.getElementById('res-cat-badge').innerHTML = `<span>${cat.icon}</span><span>${cat.name}</span>`;

            const gBadge = document.getElementById('res-genre-badge');
            if (item.genre) {
                gBadge.textContent = item.genre;
                gBadge.classList.remove('hidden');
            } else {
                gBadge.classList.add('hidden');
            }

            const resetBtn = document.getElementById('reset-cat-btn');
            if (activeCat !== 'all') resetBtn.classList.remove('hidden');
            else resetBtn.classList.add('hidden');

            document.getElementById('res-counter').textContent = `Показано ${idx} из ${total}`;

            const metaEl = document.getElementById('res-meta');
            if (item.category === 'draw') {
                metaEl.classList.add('hidden');
            } else {
                const metaParts = [item.year, item.meta].filter(Boolean);
                if (metaParts.length) {
                    metaEl.textContent = metaParts.join(' • ');
                    metaEl.classList.remove('hidden');
                } else {
                    metaEl.classList.add('hidden');
                }
            }

            const body = document.getElementById('res-body');
            if (item.category === 'draw') {
                body.innerHTML = `
                    <div class="anim-card">
                        <h1 class="text-xl sm:text-2xl md:text-[26px] font-bold tracking-tight leading-snug">
                            ${esc(item.title)}
                        </h1>
                    </div>
                `;
            } else {
                body.innerHTML = `
                    <div class="anim-card space-y-2.5">
                        <h1 class="text-xl sm:text-2xl md:text-[28px] font-bold tracking-tight leading-tight">
                            ${esc(item.title)}
                        </h1>
                        <p class="text-sm sm:text-base text-hub-lightMuted dark:text-hub-muted leading-relaxed">
                            ${esc(item.desc)}
                        </p>
                    </div>
                `;
            }
        }

        // ==================== СОБРАТЬ ВЕЧЕР ====================
        function openEveningModal() {
            generateEvening();
            const m = document.getElementById('evening-modal');
            m.classList.remove('hidden');
            m.classList.add('flex');
        }

        function closeEveningModal() {
            const m = document.getElementById('evening-modal');
            m.classList.add('hidden');
            m.classList.remove('flex');
        }

        function randFrom(cats, excludeId) {
            const list = DATA.filter(x => cats.includes(x.category));
            const filtered = list.filter(x => x.id !== excludeId);
            const pool = filtered.length ? filtered : list;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function generateEvening() {
            eveningSlots.watch = randFrom(['anime', 'movies', 'series'], eveningSlots.watch?.id);
            eveningSlots.food = randFrom(['food'], eveningSlots.food?.id);
            eveningSlots.act = randFrom(['draw', 'home', 'street'], eveningSlots.act?.id);
            renderEvening();
        }

        function rerollEveningSlot(slot) {
            if (slot === 'watch') eveningSlots.watch = randFrom(['anime', 'movies', 'series'], eveningSlots.watch?.id);
            if (slot === 'food') eveningSlots.food = randFrom(['food'], eveningSlots.food?.id);
            if (slot === 'act') eveningSlots.act = randFrom(['draw', 'home', 'street'], eveningSlots.act?.id);
            renderEvening();
        }

        function renderEvening() {
            const configs = [
                { key: 'watch', label: '🎬 Посмотреть', item: eveningSlots.watch },
                { key: 'food',  label: '🍵 Приготовить / Перекусить', item: eveningSlots.food },
                { key: 'act',   label: '✏️ Заняться / Порисовать', item: eveningSlots.act }
            ];
            document.getElementById('evening-slots').innerHTML = configs.map(c => {
                const it = c.item;
                const cat = getCat(it.category);
                const sub = it.category === 'draw' ? '' : [it.year, it.genre, it.meta].filter(Boolean).join(' • ');
                return `
                    <div class="p-4 rounded-2xl bg-hub-lightElevated/60 dark:bg-hub-elevated/70 border hub-border">
                        <div class="flex items-center justify-between gap-2 mb-1">
                            <span class="text-xs font-semibold text-hub-lightAccent dark:text-hub-accent">${c.label} · ${cat.name}</span>
                            <button type="button" onclick="rerollEveningSlot('${c.key}')" class="text-xs px-2.5 py-1 rounded-lg bg-hub-lightCard dark:bg-hub-card border hub-border hover:opacity-80">↻ Заменить</button>
                        </div>
                        <div class="font-bold text-sm sm:text-base leading-snug">${esc(it.title)}</div>
                        ${sub ? `<div class="text-[11px] text-hub-lightMuted dark:text-hub-muted mt-0.5">${esc(sub)}</div>` : ''}
                        ${it.desc ? `<p class="text-xs text-hub-lightMuted dark:text-hub-muted mt-1.5 leading-relaxed">${esc(it.desc)}</p>` : ''}
                    </div>
                `;
            }).join('');
        }

        // ==================== ПРЕДЛОЖИТЬ ИДЕЮ ====================
        function openSuggestModal() {
            if (activeCat !== 'all') document.getElementById('m-cat').value = activeCat;
            syncModalFields();
            const m = document.getElementById('suggest-modal');
            m.classList.remove('hidden');
            m.classList.add('flex');
        }

        function closeSuggestModal() {
            const m = document.getElementById('suggest-modal');
            m.classList.add('hidden');
            m.classList.remove('flex');
        }

        function syncModalFields() {
            const catId = document.getElementById('m-cat').value;
            const cat = getCat(catId);
            const gBox = document.getElementById('m-genre-box');
            const gSel = document.getElementById('m-genre');
            const dBox = document.getElementById('m-desc-box');
            const dInput = document.getElementById('m-desc');
            const yRow = document.getElementById('m-year-row');
            const tLbl = document.getElementById('m-title-lbl');
            const mLbl = document.getElementById('m-meta-lbl');

            if (cat.hasGenres) {
                gBox.classList.remove('hidden');
                gSel.innerHTML = (GENRES[catId] || []).map(g => `<option value="${g}">${g}</option>`).join('');
            } else {
                gBox.classList.add('hidden');
            }

            if (catId === 'draw') {
                dBox.classList.add('hidden');
                yRow.classList.add('hidden');
                dInput.required = false;
                tLbl.textContent = 'Идея для рисунка';
            } else {
                dBox.classList.remove('hidden');
                yRow.classList.remove('hidden');
                dInput.required = true;
                tLbl.textContent = 'Название';
                mLbl.textContent = 'Серии / Автор / Время';
            }
        }

        function submitIdea(e) {
            e.preventDefault();
            const catId = document.getElementById('m-cat').value;
            const cat = getCat(catId);
            const newItem = {
                id: `custom-${Date.now()}`,
                category: catId,
                genre: cat.hasGenres ? document.getElementById('m-genre').value : '',
                year: catId === 'draw' ? '' : document.getElementById('m-year').value.trim(),
                meta: catId === 'draw' ? '' : document.getElementById('m-meta').value.trim(),
                title: document.getElementById('m-title').value.trim(),
                desc: catId === 'draw' ? '' : document.getElementById('m-desc').value.trim()
            };

            try {
                const prev = JSON.parse(localStorage.getItem('cozy_hub_v4') || '[]');
                prev.unshift(newItem);
                localStorage.setItem('cozy_hub_v4', JSON.stringify(prev));
            } catch {}

            DATA.unshift(newItem);
            document.getElementById('total-badge').textContent = `8 категорий · ${DATA.length} идей`;
            activeCat = catId;
            activeGenre = 'all';
            renderTiles();
            renderGenres();
            currentItem = newItem;
            renderResult(newItem, 1, getPool().length);

            document.getElementById('m-title').value = '';
            document.getElementById('m-year').value = '';
            document.getElementById('m-meta').value = '';
            document.getElementById('m-desc').value = '';
            closeSuggestModal();
            showToast('Идея добавлена в базу!');
        }

        function esc(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
    </script>
</body>
</html>
