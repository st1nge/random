<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Уютный Хаб — Генератор идей</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #F6F3EC;
      --bg-card: #EFECE3;
      --bg-elevated: #E5E0D3;
      --border-color: #D5CEBE;
      --text-primary: #142620;
      --text-secondary: #485E56;
      --accent: #1B4D3E;
      --accent-text: #F6F3EC;
      --pill-bg: rgba(27, 77, 62, 0.1);
    }

    html.dark {
      --bg-main: #0C1814;
      --bg-card: #12241E;
      --bg-elevated: #183028;
      --border-color: #234237;
      --text-primary: #F2EDE2;
      --text-secondary: #98B0A6;
      --accent: #E6D5B8;
      --accent-text: #0C1814;
      --pill-bg: rgba(230, 213, 184, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      transition: background-color 0.25s ease, color 0.25s ease;
      margin: 0;
    }

    .card-surface {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .elevated-surface {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
    }

    .btn-accent {
      background-color: var(--accent);
      color: var(--accent-text);
    }
    .btn-accent:hover { opacity: 0.92; }

    /* Новогодняя гирлянда */
    .garland-strip {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 16px;
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding: 0 18px;
      pointer-events: none;
      border-top: 1px solid rgba(230, 213, 184, 0.18);
    }
    .bulb {
      width: 6px;
      height: 9px;
      border-radius: 50% 50% 50% 50% / 35% 35% 65% 65%;
      margin-top: 1px;
      animation: twinkle 2.8s infinite ease-in-out;
    }
    .bulb:nth-child(3n+1) { background: #F5E6C8; box-shadow: 0 2px 8px rgba(245, 230, 200, 0.75); animation-delay: 0s; }
    .bulb:nth-child(3n+2) { background: #F3B664; box-shadow: 0 2px 8px rgba(243, 182, 100, 0.75); animation-delay: 0.9s; }
    .bulb:nth-child(3n+3) { background: #6EE7B7; box-shadow: 0 2px 8px rgba(110, 231, 183, 0.65); animation-delay: 1.8s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    .fade-in {
      animation: fadeIn 0.22s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

  <div class="w-full max-w-[960px] mx-auto px-4 py-6 sm:py-8 flex-1 flex flex-col gap-5">
    <!-- Header -->
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl elevated-surface flex items-center justify-center text-lg select-none">🌲</div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight leading-tight">Уютный Хаб</h1>
          <p class="text-xs" style="color: var(--text-secondary)">Случайные идеи без мук выбора</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <div id="ny-countdown" class="px-3 py-1.5 rounded-full elevated-surface text-xs font-medium tracking-tight">
          🎄 Считаем до Нового года...
        </div>
        <button onclick="openAddModal()" class="px-3 py-1.5 rounded-full elevated-surface text-xs font-medium hover:opacity-85 transition cursor-pointer">
          + Предложить идею
        </button>
        <button id="theme-toggle" onclick="toggleTheme()" class="px-3 py-1.5 rounded-full elevated-surface text-xs font-medium hover:opacity-85 transition cursor-pointer">
          ☀️ Светлая
        </button>
      </div>
    </header>

    <!-- Main Result Card -->
    <main class="card-surface rounded-2xl p-6 sm:p-8 relative overflow-hidden shadow-sm">
      <div class="garland-strip" id="garland"></div>

      <div class="pt-2 flex flex-wrap items-center justify-between gap-2 mb-4">
        <div class="flex items-center gap-2">
          <span id="card-cat-badge" class="px-3 py-1 rounded-full text-xs font-semibold" style="background: var(--pill-bg);">🎌 Аниме</span>
          <span id="card-genre-badge" class="px-3 py-1 rounded-full text-xs font-medium elevated-surface">Романтика</span>
        </div>
        <span id="card-counter" class="text-xs font-medium" style="color: var(--text-secondary)">Показано 1 из 1000</span>
      </div>

      <!-- Genre Filter Bar -->
      <div id="genre-bar" class="flex flex-wrap gap-1.5 mb-5"></div>

      <!-- Content -->
      <div id="card-content" class="min-h-[140px] flex flex-col justify-center fade-in">
        <div id="card-meta" class="text-xs sm:text-sm font-medium mb-2" style="color: var(--text-secondary)"></div>
        <h2 id="card-title" class="text-2xl sm:text-3xl font-bold tracking-tight leading-snug mb-3"></h2>
        <p id="card-desc" class="text-sm sm:text-base leading-relaxed max-w-3xl" style="color: var(--text-secondary)"></p>
      </div>

      <hr class="my-6" style="border-color: var(--border-color);" />

      <!-- Primary Actions -->
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2.5">
          <button onclick="nextItem()" class="btn-accent px-5 py-2.5 rounded-xl text-sm font-semibold transition cursor-pointer flex items-center gap-2">
            <span>↻</span> Следующий вариант
          </button>
          <button onclick="openEveningModal()" class="elevated-surface px-4 py-2.5 rounded-xl text-sm font-medium hover:opacity-85 transition cursor-pointer flex items-center gap-2">
            <span>✨</span> Собрать вечер
          </button>
        </div>
        <div class="hidden sm:flex items-center gap-1.5 text-xs" style="color: var(--text-secondary)">
          <span>Или нажми</span>
          <kbd class="px-2 py-0.5 rounded elevated-surface font-mono text-[11px]">пробел</kbd>
        </div>
      </div>
    </main>

    <!-- Category Grid (5 categories) -->
    <section>
      <div class="flex items-center justify-between mb-2.5 px-1">
        <span class="text-xs font-medium" style="color: var(--text-secondary)">Выбери категорию (повторный клик крутит дальше)</span>
        <span id="total-count-label" class="text-xs font-medium" style="color: var(--text-secondary)">5 категорий</span>
      </div>
      <div id="category-grid" class="grid grid-cols-2 sm:grid-cols-5 gap-2.5"></div>
    </section>

    <footer class="text-center text-xs pt-2" style="color: var(--text-secondary)">
      Уютный Хаб • Всё работает локально и без повторов
    </footer>
  </div>

  <!-- Modal: Собрать вечер -->
  <div id="evening-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="card-surface rounded-2xl max-w-lg w-full p-6 relative">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold">✨ Сценарий на вечер</h3>
        <button onclick="closeEveningModal()" class="w-8 h-8 rounded-lg elevated-surface flex items-center justify-center text-sm cursor-pointer">✕</button>
      </div>
      <div id="evening-slots" class="flex flex-col gap-3 mb-5"></div>
      <div class="flex justify-end gap-2">
        <button onclick="rollAllEvening()" class="btn-accent px-4 py-2 rounded-xl text-sm font-semibold cursor-pointer">↻ Перекрутить всё</button>
      </div>
    </div>
  </div>

  <!-- Modal: Предложить идею -->
  <div id="add-modal" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="card-surface rounded-2xl max-w-md w-full p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold">+ Добавить свою идею</h3>
        <button onclick="closeAddModal()" class="w-8 h-8 rounded-lg elevated-surface flex items-center justify-center text-sm cursor-pointer">✕</button>
      </div>
      <form onsubmit="submitCustomIdea(event)" class="flex flex-col gap-3">
        <div>
          <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary)">Категория</label>
          <select id="add-cat" onchange="toggleAddFields()" class="w-full px-3 py-2 rounded-xl elevated-surface text-sm outline-none">
            <option value="anime">🎌 Аниме</option>
            <option value="movies">🎬 Фильмы</option>
            <option value="series">📺 Сериалы</option>
            <option value="books">📚 Книги</option>
            <option value="draw">✏️ Порисовать</option>
          </select>
        </div>
        <div id="add-genre-wrap">
          <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary)">Жанр</label>
          <input id="add-genre" type="text" placeholder="Например: Романтика" class="w-full px-3 py-2 rounded-xl elevated-surface text-sm outline-none" />
        </div>
        <div>
          <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary)">Название или идея для рисунка</label>
          <input id="add-title" type="text" required placeholder="Введите название..." class="w-full px-3 py-2 rounded-xl elevated-surface text-sm outline-none" />
        </div>
        <div id="add-meta-wrap">
          <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary)">Год / Автор / Серии (необязательно)</label>
          <input id="add-meta" type="text" placeholder="Например: 2024 • 12 серий" class="w-full px-3 py-2 rounded-xl elevated-surface text-sm outline-none" />
        </div>
        <div id="add-desc-wrap">
          <label class="block text-xs font-medium mb-1" style="color: var(--text-secondary)">Краткое описание</label>
          <textarea id="add-desc" rows="3" placeholder="О чём это в паре предложений..." class="w-full px-3 py-2 rounded-xl elevated-surface text-sm outline-none"></textarea>
        </div>
        <button type="submit" class="btn-accent w-full py-2.5 rounded-xl text-sm font-semibold mt-1 cursor-pointer">Сохранить в базу</button>
      </form>
    </div>
  </div>

  <script>
    const DB = {"anime": [{"title": "Дотянуться до тебя", "genre": "Романтика", "meta": "2009 • 25 серий", "desc": "Тихая старшеклассница Савако, которую все боятся из-за сходства с героиней ужастиков, постепенно сближается с самым популярным и открытым парнем класса."}, {"title": "Снежная принцесса и её верный рыцарь", "genre": "Романтика", "meta": "2023 • 12 серий", "desc": "История нежных чувств между девушкой, скрывающей свой голос, и парнем из знатного рода, который решает защищать её любой ценой."}, {"title": "Золотая пора", "genre": "Романтика", "meta": "2013 • 24 серии", "desc": "Потерявший память первокурсник токийского университета пытается начать жизнь заново и влюбляется в яркую, но ранимую однокурсницу."}, {"title": "Бессонница после школы", "genre": "Романтика", "meta": "2023 • 13 серий", "desc": "Двое старшеклассников, страдающих бессонницей, находят убежище в заброшенной школьной обсерватории и начинают заниматься ночной астрофотографией."}, {"title": "Твоя апрельская ложь", "genre": "Романтика", "meta": "2014 • 22 серии", "desc": "Талантливый пианист, переставший слышать звук собственного инструмента после семейной трагедии, встречает взбалмошную скрипачку, возвращающую ему краски жизни."}, {"title": "Хоримия", "genre": "Романтика", "meta": "2021 • 13 серий", "desc": "Популярная в школе девушка дома следит за младшим братом, а тихий парень в очках за пределами класса оказывается неформалом с пирсингом и татуировками."}, {"title": "Любовь с кончиков пальцев", "genre": "Романтика", "meta": "2024 • 12 серий", "desc": "Глухая от рождения студентка Юки знакомится с путешественником Ицуоми, который начинает учить язык жестов, чтобы стать ближе к её миру."}, {"title": "Опасность в моём сердце", "genre": "Романтика", "meta": "2023 • 25 серий", "desc": "Мрачный интроверт и самая красивая, но невероятно непосредственная модель класса постепенно обнаруживают, что не могут провести ни дня друг без друга."}, {"title": "Этот глупый свин не понимает мечту девочки-зайки", "genre": "Романтика", "meta": "2018 • 13 серий", "desc": "Старшеклассник Сакута сталкивается с загадочным подростковым синдромом, из-за которого старшеклассницу Май перестают замечать окружающие."}, {"title": "Скажи: «Я люблю тебя»", "genre": "Романтика", "meta": "2012 • 13 серий", "desc": "Замкнутая Мэй, которая шестнадцать лет избегала друзей, случайно задевает самого популярного парня школы, и тот решает во что бы то ни стало завоевать её доверие."}, {"title": "Цуки га Кирей (Как прекрасна луна)", "genre": "Романтика", "meta": "2017 • 12 серий", "desc": "Очень искренняя и тихая история первой любви между начинающим писателем и легкоатлеткой в выпускном классе средней школы."}, {"title": "Ао Хару Райд (Дорога юности)", "genre": "Романтика", "meta": "2014 • 12 серий", "desc": "Футаба вновь встречает свою первую любовь из средней школы, но замечает, что за прошедшие годы парень сильно изменился и стал холодным."}, {"title": "Унесённые призраками", "genre": "Романтика", "meta": "2001 • Фильм", "desc": "Девочка Тихиро попадает в таинственный мир духов и богов, где ей предстоит проявить смелость и доброту, чтобы спасти родителей и загадочного юношу Хаку."}, {"title": "Твоё имя", "genre": "Романтика", "meta": "2016 • Фильм", "desc": "Провинциальная школьница и токийский старшеклассник начинают необъяснимым образом меняться телами во сне, оставляя друг другу записки."}, {"title": "Дитя погоды", "genre": "Романтика", "meta": "2019 • Фильм", "desc": "Сбежавший в дождливый Токио подросток знакомится с девушкой, обладающей невероятным даром разгонять тучи силой молитвы."}, {"title": "Форма голоса", "genre": "Романтика", "meta": "2016 • Фильм", "desc": "Бывший школьный хулиган спустя годы пытается найти глухую одноклассницу, которую когда-то травил, чтобы попросить у неё прощения."}, {"title": "Сад изящных слов", "genre": "Романтика", "meta": "2013 • Фильм", "desc": "В сезон дождей юный сапожник и загадочная женщина регулярно встречаются в беседке токийского парка, не re": "Романтика", "meta": "2008 • 24 серии", "desc": "Трогательная история взросления, создания семьи и преодоления тяжелых жизненных испытаний в маленьком японском городке."}, {"title": "Орегайру (Как и ожидалось, моя школьная романтическая жизнь не удалась)", "genre": "Романтика", "meta": "2013 • 38 серий", "desc": "Циничный одиночка Хатиман по принуждению учителя вступает в клуб волонтёров, где вместе с двумя девушками решает чужие проблемы."}, {"title": "Кагуя-сама: В любви как на войне", "genre": "Романтика", "meta": "2019 • 37 серий", "desc": "Два гения элитной академии влюблены друг в друга, но гордость мешает им признаться, поэтому каждый день превращается в психологическую дуэль."}, {"title": "Эта фарфоровая кукла влюбилась", "genre": "Романтика", "meta": "2022 • 12 серий", "desc": "Скромный мастер по изготовлению традиционных кукол начинает шить косплей-костюмы для самой яркой и общительной девушки в классе."}, {"title": "Ангел по соседству", "genre": "Романтика", "meta": "2023 • 12 серий", "desc": "Неприметный школьник одалживает зонт первой красавице школы, после чего она начинает регулярно заходить к нему, чтобы готовить ужин и наводить порядок."}, {"title": "Домекано (Домашняя девушка)", "genre": "Романтика", "meta": "2019 • 12 серий", "desc": "Отец старшеклассника Нацуо женится во второй раз, и в доме появляются две сводные сестры, с каждой из которых героя связывает непростая история."}, {"title": "Не издевайся, Нагаторо", "genre": "Романтика", "meta": "2021 • 24 серии", "desc": "Энергичная младшеклассница постоянно подшучивает над застенчивым художником, но за её дразнилками скрывается искренняя привязанность."}, {"title": "Удзаки хочет тусоваться!", "genre": "Романтика", "meta": "2020 • 24 серии", "desc": "Шумная первокурсница решает во что бы то ни стало вытащить своего молчаливого сэмпая из одиночества и скучных будней."}, {"title": "Такаги-сан, мастер дразнилок", "genre": "Романтика", "meta": "2018 • 36 серий", "desc": "Нисиката каждый день прид     const CATEGORIES = [
      { id: 'anime', name: 'Аниме', icon: '🎌', hasGenres: true },
      { id: 'movies', name: 'Фильмы', icon: '🎬', hasGenres: true },
      { id: 'series', name: 'Сериалы', icon: '📺', hasGenres: true },
      { id: 'books', name: 'Книги', icon: '📚', hasGenres: true },
      { id: 'draw', name: 'Порисовать', icon: '✏️', hasGenres: false }
    ];

    // Load custom user ideas from localStorage
    try {
      const savedCustom = JSON.parse(localStorage.getItem('cozy_hub_custom_v1') || '{}');
      for (const catId of Object.keys(savedCustom)) {
        if (DB[catId] && Array.isArray(savedCustom[catId])) {
          DB[catId] = [...savedCustom[catId], ...DB[catId]];
        }
      }
    } catch (e) {}

    let currentCat = 'anime';
    let currentGenre = 'Все';
    let currentItem = null;
    const seenIndices = {}; // key: cat_genre -> Set of indices

    function getFilteredList(catId, genre) {
      const list = DB[catId] || [];
      if (!genre || genre === 'Все') return list;
      return list.filter(item => item.genre === genre);
    }

    function getGenresForCat(catId) {
      const cat = CATEGORIES.find(c => c.id === catId);
      if (!cat || !cat.hasGenres) return [];
      const set = new Set();
      (DB[catId] || []).forEach(item => {
        if (item.genre) set.add(item.genre);
      });
      return ['Все', ...Array.from(set)];
    }

    function pickRandom(catId, genre = 'Все') {
      const list = getFilteredList(catId, genre);
      if (!list.length) return null;
      const key = `${catId}_${genre}`;
      if (!seenIndices[key]) seenIndices[key] = new Set();
      if (seenIndices[key].size >= list.length) {
        seenIndices[key].clear();
      }
      let idx;
      let attempts = 0;
      do {
        idx = Math.floor(Math.random() * list.length);
        attempts++;
      } while (seenIndices[key].has(idx) && attempts < 50);

      if (seenIndices[key].has(idx)) {
        for (let i = 0; i < list.length; i++) {
          if (!seenIndices[key].has(i)) { idx = i; break; }
        }
      }
      seenIndices[key].add(idx);
      return { item: list[idx], shown: seenIndices[key].size, total: list.length };
    }

    function renderCategories() {
      const grid = document.getElementById('category-grid');
      grid.innerHTML = CATEGORIES.map(cat => {
        const active = cat.id === currentCat;
        const count = (DB[cat.id] || []).length;
        return `
          <button onclick="selectCategory('${cat.id}')"
            class="px-3.5 py-3 rounded-xl text-left flex items-center justify-between gap-2 transition cursor-pointer ${active ? 'btn-accent font-semibold shadow-sm' : 'card-surface hover:opacity-85'}">
            <div class="flex items-center gap-2 min-w-0">
              <span class="text-base shrink-0">${cat.icon}</span>
              <span class="text-xs sm:text-sm truncate">${cat.name}</span>
            </div>
            <span class="text-[11px] px-2 py-0.5 rounded-full shrink-0"
              style="${active ? 'background: rgba(0,0,0,0.18); color: inherit;' : 'background: var(--pill-bg); color: var(--text-secondary);'}">
              ${count}
            </span>
          </button>
        `;
      }).join('');

      const totalAll = Object.values(DB).reduce((acc, arr) => acc + arr.length, 0);
      document.getElementById('total-count-label').textContent = `5 категорий • ${totalAll} идей`;
    }

    function renderGenres() {
      const bar = document.getElementById('genre-bar');
      const genres = getGenresForCat(currentCat);
      if (!genres.length) {
        bar.innerHTML = '';
        bar.classList.add('hidden');
        return;
      }
      bar.classList.remove('hidden');
      bar.innerHTML = genres.map(g => {
        const active = g === currentGenre;
        return `
          <button onclick="selectGenre('${g}')"
            class="px-3 py-1 rounded-full text-xs font-medium transition cursor-pointer ${active ? 'btn-accent' : 'elevated-surface hover:opacity-80'}">
            ${g}
          </button>
        `;
      }).join('');
    }

    function renderCard() {
      const res = pickRandom(currentCat, currentGenre);
      if (!res) return;
      currentItem = res.item;

      const catObj = CATEGORIES.find(c => c.id === currentCat);
      document.getElementById('card-cat-badge').textContent = `${catObj.icon} ${catObj.name}`;

      const genreBadge = document.getElementById('card-genre-badge');
      if (currentItem.genre) {
        genreBadge.textContent = currentItem.genre;
        genreBadge.classList.remove('hidden');
      } else {
        genreBadge.classList.add('hidden');
      }

      document.getElementById('card-counter').textContent = `Показано ${res.shown} из ${res.total}`;

      const contentBox = document.getElementById('card-content');
      contentBox.classList.remove('fade-in');
      void contentBox.offsetWidth;
      contentBox.classList.add('fade-in');

      const metaEl = document.getElementById('card-meta');
      const titleEl = document.getElementById('card-title');
      const descEl = document.getElementById('card-desc');

      metaEl.textContent = currentItem.meta || '';
      titleEl.textContent = currentItem.title;

      if (currentCat === 'draw' || !currentItem.desc) {
        descEl.textContent = '';
        descEl.classList.add('hidden');
      } else {
        descEl.textContent = currentItem.desc;
        descEl.classList.remove('hidden');
      }
    }

    function selectCategory(catId) {
      if (currentCat !== catId) {
        currentCat = catId;
        currentGenre = 'Все';
      }
      renderCategories();
      renderGenres();
      renderCard();
    }

    function selectGenre(genre) {
      currentGenre = genre;
      renderGenres();
      renderCard();
    }

    function nextItem() {
      renderCard();
    }

    // Spacebar shortcut
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
        e.preventDefault();
        nextItem();
      }
    });

    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      localStorage.setItem('cozy_hub_theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-toggle').textContent = isDark ? '☀️ Светлая' : '🌙 Тёмная';
    }
    if (localStorage.getItem('cozy_hub_theme') === 'light') {
      document.documentElement.classList.remove('dark');
      document.getElementById('theme-toggle').textContent = '🌙 Тёмная';
    }

    // Automatic New Year Countdown (always targets Jan 1 of next year automatically)
    function pluralDays(n) {
      const mod10 = n % 10;
      const mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return 'день';
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return 'дня';
      return 'дней';
    }

    function updateCountdown() {
      const now = new Date();
      const el = document.getElementById('ny-countdown');
      if (now.getMonth() === 0 && now.getDate() === 1) {
        el.textContent = `🎄 С Новым ${now.getFullYear()} годом!`;
        return;
      }
      const nextYear = now.getFullYear() + 1;
      const target = new Date(nextYear, 0, 1, 0, 0, 0);
      const diff = target - now;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / 1000 / 60) % 60);
      el.textContent = `🎄 До ${nextYear}: ${days} ${pluralDays(days)} ${hours} ч. ${mins} м.`;
    }
    updateCountdown();
    setInterval(updateCountdown, 30000);

    // Garland bulbs
    const garland = document.getElementById('garland');
    for (let i = 0; i < 22; i++) {
      const b = document.createElement('span');
      b.className = 'bulb';
      garland.appendChild(b);
    }

    // Evening Combo Modal
    let eveningState = { watch: null, read: null, draw: null };

    function rollSlot(slot) {
      if (slot === 'watch') {
        const pool = [...DB.anime, ...DB.movies, ...DB.series];
        eveningState.watch = pool[Math.floor(Math.random() * pool.length)];
      } else if (slot === 'read') {
        eveningState.read = DB.books[Math.floor(Math.random() * DB.books.length)];
      } else if (slot === 'draw') {
        eveningState.draw = DB.draw[Math.floor(Math.random() * DB.draw.length)];
      }
      renderEveningSlots();
    }

    function rollAllEvening() {
      rollSlot('watch');
      rollSlot('read');
      rollSlot('draw');
    }

    function renderEveningSlots() {
      const slots = [
        { key: 'watch', label: '🎬 Посмотреть', item: eveningState.watch },
        { key: 'read', label: '📚 Почитать перед сном', item: eveningState.read },
        { key: 'draw', label: '✏️ Лёгкий скетч', item: eveningState.draw }
      ];
      document.getElementById('evening-slots').innerHTML = slots.map(s => `
        <div class="elevated-surface rounded-xl p-3.5 flex items-start justify-between gap-3">
          <div>
            <div class="text-xs font-medium mb-1" style="color: var(--text-secondary)">${s.label}</div>
            <div class="text-sm font-bold">${s.item ? s.item.title : ''}</div>
            ${s.item && s.item.meta ? `<div class="text-xs mt-0.5" style="color: var(--text-secondary)">${s.item.meta}</div>` : ''}
          </div>
          <button onclick="rollSlot('${s.key}')" class="px-2.5 py-1.5 rounded-lg card-surface text-xs font-medium hover:opacity-80 cursor-pointer shrink-0">↻</button>
        </div>
      `).join('');
    }

    function openEveningModal() {
      rollAllEvening();
      const m = document.getElementById('evening-modal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }
    function closeEveningModal() {
      const m = document.getElementById('evening-modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    // Add Idea Modal
    function openAddModal() {
      const m = document.getElementById('add-modal');
      m.classList.remove('hidden');
      m.classList.add('flex');
      toggleAddFields();
    }
    function closeAddModal() {
      const m = document.getElementById('add-modal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }
    function toggleAddFields() {
      const cat = document.getElementById('add-cat').value;
      const isDraw = cat === 'draw';
      document.getElementById('add-genre-wrap').style.display = isDraw ? 'none' : 'block';
      document.getElementById('add-meta-wrap').style.display = isDraw ? 'none' : 'block';
      document.getElementById('add-desc-wrap').style.display = isDraw ? 'none' : 'block';
    }
    function submitCustomIdea(e) {
      e.preventDefault();
      const cat = document.getElementById('add-cat').value;
      const title = document.getElementById('add-title').value.trim();
      const genre = cat === 'draw' ? '' : (document.getElementById('add-genre').value.trim() || 'Другое');
      const meta = cat === 'draw' ? 'Только карандаш' : document.getElementById('add-meta').value.trim();
      const desc = cat === 'draw' ? '' : document.getElementById('add-desc').value.trim();

      const newItem = { title, genre, meta, desc };
      DB[cat].unshift(newItem);

      try {
        const saved = JSON.parse(localStorage.getItem('cozy_hub_custom_v1') || '{}');
        if (!saved[cat]) saved[cat] = [];
        saved[cat].unshift(newItem);
        localStorage.setItem('cozy_hub_custom_v1', JSON.stringify(saved));
      } catch (err) {}

      e.target.reset();
      closeAddModal();
      currentCat = cat;
      currentGenre = 'Все';
      renderCategories();
      renderGenres();
      currentItem = newItem;
      const catObj = CATEGORIES.find(c => c.id === currentCat);
      document.getElementById('card-cat-badge').textContent = `${catObj.icon} ${catObj.name}`;
      document.getElementById('card-title').textContent = newItem.title;
      document.getElementById('card-meta').textContent = newItem.meta;
      document.getElementById('card-desc').textContent = newItem.desc;
    }

    // Init
    renderCategories();
    renderGenres();
    renderCard();
  </script>
</body>
</html>
